name: Deploy to Siteground

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Instalar Angular CLI
      - name: Set Angular CLI
        run: npm install -g @angular/cli

      # Instalar dependencias
      - name: Install Dependencies
        run: npm install

      # Build del Proyecto Angular (producción)
      - name: Build Angular Project
        run: ng build --configuration production

      # Verificar el build
      - name: Verify Build Output
        run: |
          echo "=== Build Output ==="
          ls -la dist/mi-app-angular/browser/

      # Configurar clave SSH con la acción oficial de GitHub
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SITEGROUND_SSH_KEY }}

      # Agregar el host a known_hosts para evitar confirmación manual
      - name: Add SSH known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SITEGROUND_PORT }} ${{ secrets.SITEGROUND_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      # Desplegar al servidor SiteGround via rsync + SSH
      - name: Deploy to SiteGround
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.SITEGROUND_PORT }} -o StrictHostKeyChecking=no" \
            dist/mi-app-angular/browser/ \
            ${{ secrets.SITEGROUND_USER }}@${{ secrets.SITEGROUND_HOST }}:~/www/jesusdavidm11.sg-host.com/public_html/

      # Purgar el caché de Nginx en SiteGround después del despliegue
      - name: Purge SiteGround Nginx Cache
        run: |
          ssh -p ${{ secrets.SITEGROUND_PORT }} -o StrictHostKeyChecking=no ${{ secrets.SITEGROUND_USER }}@${{ secrets.SITEGROUND_HOST }} "php -r '\$sock = \"/chroot/tmp/site-tools.sock\"; \$request = array(\"api\" => \"domain-all\", \"cmd\" => \"update\", \"settings\" => array(\"json\" => 1), \"params\" => array(\"flush_cache\" => \"1\", \"id\" => \"jesusdavidm11.sg-host.com\", \"path\" => \"/(.*)\")); \$payload = json_encode(\$request, JSON_FORCE_OBJECT) . \"\n\"; \$fp = stream_socket_client(\"unix://\" . \$sock); if (\$fp) { fwrite(\$fp, \$payload); fclose(\$fp); }'"

